# Render Blueprint — https://render.com/docs/blueprint-spec
# Backend: FastAPI + Socket.IO (uvicorn), not Django/gunicorn.
services:
  - type: web
    name: titan-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
